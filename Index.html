 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FarmLink AI — Digital Agriculture Marketplace</title>

  <link rel="stylesheet" href="Style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<!-- LOGIN SCREEN -->
<section id="loginPage" class="login-page">

  <div class="login-left">

    <div class="brand">
      <div class="logo">
        <img src="logo.png" alt="FarmLink AI Logo">
      </div>

      <span>FarmLink<span>AI</span></span>
    </div>

    <div class="hero-text">
      <span class="badge">🚜 Smart Agriculture Platform</span>

      <h1>From Farm<br>to <span>Market.</span></h1>

      <p>
        Connect directly with consumers and bulk buyers,
        optimize logistics and make smarter decisions with AI.
      </p>

      <div class="stats">
        <div>
          <strong>10K+</strong>
          <small>Farmers</small>
        </div>

        <div>
          <strong>₹2.4Cr+</strong>
          <small>Trade Volume</small>
        </div>

        <div>
          <strong>35%</strong>
          <small>Less Waste</small>
        </div>
      </div>
    </div>

  </div>

  <div class="login-card">

    <div class="mobile-logo">
      <img src="logo.png" alt="FarmLink AI Logo">
      <span>FarmLinkAI</span>
    </div>

    <h2>Welcome back 👋</h2>

    <p class="sub">
      Login to your agriculture marketplace
    </p>

    <div class="role-selector">

      <button class="role active" onclick="selectRole(this,'Farmer')">
        🚜 Farmer
      </button>

      <button class="role" onclick="selectRole(this,'Buyer')">
        🛒 Buyer
      </button>

    </div>

    <label>Mobile Number</label>

    <div class="input-box">
      <span>+91</span>
      <input id="phone" type="tel" placeholder="Enter mobile number">
    </div>
